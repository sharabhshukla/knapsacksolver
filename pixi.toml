[workspace]
name = "knapsacksolver"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
scikit-build-core = ">=0.11.6"
ortools-cpp = ">=9.6,<10"
coin-or-cbc = "*"
highs = ">=1.13.0,<2"
pybind11 = ">=3.0.1,<4"
cmake = "*"
ninja = ">=1.13.2,<2"
scip = ">=10.0.1,<11"

[tasks]
build = { cmd = "python -m pip install -e . --no-build-isolation", env = { PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" } }
